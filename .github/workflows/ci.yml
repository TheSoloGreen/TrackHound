name: CI

on:
  push:
    branches: [master]
    tags: ['v[0-9]*']
  pull_request:

jobs:
  release-metadata:
    name: Version and release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      revision: ${{ steps.metadata.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate aligned versions, changelog and optional release tag
        id: metadata
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor HEAD origin/master
            python backend/app/release.py metadata --tag "$GITHUB_REF_NAME"
          else
            python backend/app/release.py metadata
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: release-metadata
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trackhound
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: trackhound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackhound"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://trackhound:ci-only-postgres-password@localhost:5432/trackhound
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install media tools for real MKV integration tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mediainfo mkvtoolnix

      - name: Run backend tests
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest -q

  frontend-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    needs: release-metadata
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend regression tests
        run: npm test

      - name: Build frontend
        run: npm run build

  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
      - container-checks

    # Don't publish images from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/thesologreen/trackhound
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  versioned-release:
    name: Publish immutable versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [release-metadata, backend-tests, frontend-build, container-checks]
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_REVISION: ${{ needs.release-metadata.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified SHA image without rebuilding or overwriting versions
        run: python backend/app/release.py promote --tag "$GITHUB_REF_NAME" --revision "$RELEASE_REVISION" --notes release-notes.md
      - name: Publish release notes for the existing tag
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "TrackHound $GITHUB_REF_NAME" --notes-file release-notes.md
          fi

  container-checks:
    name: Container and Compose checks
    runs-on: ubuntu-latest
    needs: release-metadata
    permissions:
      contents: read
      packages: read
    env:
      # Deliberately synthetic CI-only values, never deployment credentials.
      SECRET_KEY: ci-only-signing-key-00000000000000000000000000000000
      ENCRYPTION_KEY: ci-only-encryption-key-000000000000000000000000000
      ALLOWED_PLEX_USER_IDS: '123'
      EXPECTED_VERSION: ${{ needs.release-metadata.outputs.version }}
      EXPECTED_REVISION: ${{ needs.release-metadata.outputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate both Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.postgres.yml config --quiet
          for file in docker-compose.yml docker-compose.postgres.yml; do
            if env -u SECRET_KEY docker compose -f "$file" config --quiet; then
              exit 1
            fi
            if env -u ENCRYPTION_KEY docker compose -f "$file" config --quiet; then
              exit 1
            fi
          done
      - name: Build production image
        if: github.ref_type != 'tag'
        run: docker build --build-arg BUILD_REVISION=${{ github.sha }} -t trackhound:test .
      - name: Verify and test the exact already-published image for a release tag
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python backend/app/release.py check-source --revision "$EXPECTED_REVISION"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "ghcr.io/thesologreen/trackhound:sha-${EXPECTED_REVISION:0:7}"
          docker tag "ghcr.io/thesologreen/trackhound:sha-${EXPECTED_REVISION:0:7}" trackhound:test
      - name: Reject direct image startup with default keys
        run: |
          if docker run --rm trackhound:test python -c 'from app.config import get_settings; get_settings()'; then
            exit 1
          fi
      - name: Verify native tools and default write policy
        run: |
          docker run --rm -e SECRET_KEY -e ENCRYPTION_KEY trackhound:test python -c 'import shutil; from app.core.media_access import get_media_edit_capabilities; assert shutil.which("mkvmerge") and shutil.which("mkvpropedit"); c = get_media_edit_capabilities(); assert not c.set_default_audio and not c.remove_audio_tracks'
      - name: Verify startup and health endpoint
        run: |
          docker run -d --name trackhound-smoke -e SECRET_KEY -e ENCRYPTION_KEY -e ALLOWED_PLEX_USER_IDS trackhound:test
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' trackhound-smoke)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs trackhound-smoke
          exit 1
      - name: Verify no-login default and running build identity
        run: |
          docker exec -e EXPECTED_VERSION -e EXPECTED_REVISION trackhound-smoke python -c 'import json, os, urllib.request; get = lambda path: json.load(urllib.request.urlopen("http://localhost:8000" + path)); info = get("/api/info"); assert info["version"] == os.environ["EXPECTED_VERSION"]; assert info["revision"] == os.environ["EXPECTED_REVISION"]; assert get("/api/auth/config")["mode"] == "none"; assert get("/api/media/stats")["total_files"] == 0; assert get("/api/jobs")["items"] == []; assert get("/api/settings/evaluation")["files_total"] == 0'
      - name: Verify durable cached reevaluation in the running container
        run: |
          docker exec -i trackhound-smoke python - <<'PY'
          import json, time, urllib.request
          base = "http://localhost:8000"
          request = urllib.request.Request(base + "/api/settings/reevaluate", data=b"{}", headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 202
              job = json.load(response)
          for attempt in range(30):
              with urllib.request.urlopen(base + "/api/jobs/" + str(job["id"]), timeout=10) as response:
                  result = json.load(response)
              if result["status"] not in ("queued", "running"):
                  assert result["status"] == "completed", result
                  assert result["result"]["files_total"] == 0
                  break
              time.sleep(0.2)
          else:
              raise AssertionError("Cached policy job did not finish")
          PY
      - name: Clean up smoke container
        if: always()
        run: docker rm -f trackhound-smoke || true
